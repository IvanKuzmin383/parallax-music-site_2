# Фрагмент для nginx: статическая страница техработ, если Node/PM2 недоступен.
#
# 1) Убедитесь, что файл есть после деплоя:
#    /var/www/parallaxmusic/public/maintenance.html
#
# 2) Включить режим (создать маркер):
#    touch /var/www/parallaxmusic/maintenance.on
#    nginx -t && systemctl reload nginx
#
# 3) Выключить:
#    rm -f /var/www/parallaxmusic/maintenance.on
#    nginx -t && systemctl reload nginx
#
# Вставьте внутрь server { ... } (перед proxy_pass на Node):

set $maintenance 0;
if (-f /var/www/parallaxmusic/maintenance.on) {
    set $maintenance 1;
}

location = /maintenance.html {
    root /var/www/parallaxmusic/public;
    add_header Retry-After 3600 always;
    add_header Cache-Control "no-store" always;
}

if ($maintenance = 1) {
    return 503;
}

error_page 503 /maintenance.html;
